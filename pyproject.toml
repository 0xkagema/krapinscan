[project]
name = "krapinscan"
version = "0.1.0"
description = "Extract structured details from Kenya Revenue Authority PIN certificates"
readme = "README.md"
authors = [
    { name = "0xkagema", email = "reecejames934@gmail.com" }
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
]

[project.scripts]
krapinscan = "krapinscan:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
